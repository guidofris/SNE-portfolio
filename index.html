<!DOCTYPE html>
<html lang="nl">
<head>
  <meta charset="UTF-8">
  <title>Portfolio SNE - Systeem- en Netwerkbeheer | PXL</title>
  <meta http-equiv="X-UA-Compatible" content="IE=edge,chrome=1" />
  <meta name="description" content="Portfolio voor de Associate Degree Systeem- en Netwerkbeheer aan PXL">
  <meta name="keywords" content="portfolio, systeem en netwerkbeheer, PXL, werkplekleren, SNE">
  <meta name="author" content="Student SNE">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, minimum-scale=1.0">
  <link rel="icon" type="image/x-icon" href="./images/pxl-favicon.ico">
  <link rel="stylesheet" href="assets/docsify/style.min.css" title="docsify-darklight-theme" type="text/css" />
  <link rel="stylesheet" href="assets/fontawsome/fontawesome.css" />
  <link rel="stylesheet" href="assets/fontawsome/brands.css" />
  <link rel="stylesheet" href="assets/fontawsome/regular.css" />
  <link rel="stylesheet" href="assets/fontawsome/solid.css" />
  <link rel="stylesheet" href="assets/custom.css" />
  <script src="assets/fontawsome/40e0e32ae3.js" crossorigin="anonymous"></script>

</head>
<body>
  <div id="app"></div>
  <script>
    window.$docsify = {
      name: 'SNE Portfolio',
      repo: '',
      loadSidebar: true,
      subMaxLevel: 3,
      maxLevel: 4,
      auto2top: true,
      coverpage: false,
      executeScript: true,
      loadNavbar: false,
      mergeNavbar: true,
      alias: {
        '/(?!Wiki).*/_sidebar.md': '/_sidebar.md',
      },
      search: {
        maxAge: 86400000, // 1 dag
        paths: 'auto',
        placeholder: 'Zoek in portfolio...',
        noData: 'Geen resultaten gevonden',
        depth: 4,
        hideOtherSidebarContent: false,
      },
      pagination: {
        previousText: 'Vorige',
        nextText: 'Volgende',
        crossChapter: true,
        crossChapterText: true,
      },
      plugins: [
        // Skill badges and progress bars
        function(hook, vm) {
          hook.afterEach(function(html, next) {
            // Skill badges: [skill:TechnologieNaam]
            html = html.replace(/\[skill:([^\]]+)\]/g, '<span class="skill-badge">$1</span>');
            // Progress bars: [progress:75]
            html = html.replace(/\[progress:(\d+)\]/g, '<div class="progress"><div class="progress-bar" style="width: $1%"></div></div>');
            next(html);
          });

          // Add fade-in animation to rendered content
          hook.doneEach(function() {
            const main = document.querySelector('main');
            if (main) {
              main.classList.add('fade-in');
            }
          });
        }
      ]
    };


  </script>
  <!-- Docsify v4 -->
  <script src="assets/docsify/docsify@4.js"></script>
  <script src="assets/docsify/search.min.js"></script>
  <script src="assets/docsify/docsify-copy-code.min.js"></script>
  <script src="assets/docsify/prism-bash.min.js"></script>
  <script src="assets/docsify/docsify-pagination.min.js"></script>
  <script src="assets/docsify/docsify-fontawesome.min.js"></script>
  <script src="assets/docsify/index.min.js" type="text/javascript">
</script>
</body>
</html>
